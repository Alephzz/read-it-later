<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Read It Later - 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e20;
      color: #e0e0e0;
      padding: 24px;
      max-width: 400px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 16px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    input[type="number"] {
      width: 120px;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2d;
      color: #e0e0e0;
      font-size: 13px;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    button {
      padding: 8px 16px;
      background: #f5a623;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #e6951a; }
    .saved { color: #4caf50; font-size: 12px; margin-left: 8px; display: none; }
  </style>
</head>
<body>
  <h1>📖 Read It Later 设置</h1>

  <div class="field">
    <label>本地 HTTP 端口</label>
    <input type="number" id="port" value="19623" min="1024" max="65535">
    <div class="hint">必须与 Read It Later macOS 应用中的设置一致</div>
  </div>

  <button id="saveBtn">保存设置</button>
  <span class="saved" id="savedMsg">已保存 ✓</span>

  <script src="options.js"></script>
</body>
</html>
