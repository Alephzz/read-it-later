<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e20;
      color: #e0e0e0;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2 .icon { font-size: 18px; }
    .page-info {
      background: #2a2a2d;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .page-title {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-url {
      font-size: 10px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #f5a623;
      color: #1a1a1a;
    }
    .btn-primary:hover { background: #e6951a; }
    .btn-primary:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      display: none;
    }
    .status.success { display: block; background: #1a3a1a; color: #4caf50; }
    .status.error { display: block; background: #3a1a1a; color: #ef5350; }
    .status.duplicate { display: block; background: #3a2a1a; color: #ff9800; }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #555;
    }
    .footer a { color: #888; text-decoration: none; }
  </style>
</head>
<body>
  <h2><span class="icon">📖</span> Read It Later</h2>

  <div class="page-info">
    <div class="page-title" id="pageTitle">Loading...</div>
    <div class="page-url" id="pageUrl">...</div>
  </div>

  <button class="btn btn-primary" id="saveBtn" disabled>保存到 Read It Later</button>

  <div class="status" id="statusMsg"></div>

  <div class="footer">
    <a href="#" id="settingsLink">设置</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
